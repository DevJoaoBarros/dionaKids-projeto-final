services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: dionakids
      POSTGRES_PASSWORD: dionakids123
      POSTGRES_DB: dionakids
    ports:
      - "5432:5432"
    volumes:
      - "db_data:/var/lib/postgresql/data"

  backend:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://dionakids:dionakids123@db:5432/dionakids
      JWT_SECRET: dionakids-segredo-dev
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
     - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      
volumes:
  db_data: